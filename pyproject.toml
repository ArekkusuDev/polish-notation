[project]
name = "polish-notation"
description = "Polish Notation Converter"
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Victor Salazar Lopez", email = "victorsalazarlopez@proton.me" }
]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Rust"
]
dependencies = [
  "questionary>=2.1.1",
  "rich>=14.1.0",
]
dynamic = ["version"]

[project.scripts]
polish-notation = "polish_notation:main"

[project.optional-dependencies]
tests = [
  "pytest>=8.4.2",
]

[dependency-groups]
dev = [
  "basedpyright>=1.39.9",
  "commitizen>=4.9.1",
  "pre-commit>=4.3.0",
  "ruff>=0.13.3",
]

[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[tool.maturin]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]
module-name = "polish_notation._core"
python-source = "python"
